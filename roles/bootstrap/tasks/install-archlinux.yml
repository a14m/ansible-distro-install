---
- name: "Update live environment"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "pacman -Sy --needed archlinux-keyring --noconfirm"
  changed_when: true

- name: "Run pacstrap"
  ansible.builtin.command:
    cmd: "pacstrap -K {{ mnt_root_path }} base linux linux-firmware less nano"
  changed_when: true

- name: "Generate fstab"
  ansible.builtin.shell:
    cmd: "genfstab -t PARTLABEL {{ mnt_root_path }} > {{ mnt_root_path }}/etc/fstab"
  changed_when: true

- name: "Configure pacman in chroot"
  ansible.builtin.copy:
    src: "/etc/pacman.conf"
    dest: "{{ mnt_root_path }}/etc/pacman.conf"
    remote_src: true
    force: false
    mode: "0644"

- name: "Configure system in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} {{ item }}"
  changed_when: true
  loop:
    - "pacman-key --init"
    - "pacman-key --populate"
    - "pacman -Syyu --noconfirm"

- name: "Install systemd-boot to EFI partition"
  # ships with base, no separate package needed. Auto-detects the ESP from fstab.
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} bootctl install --esp-path=/boot/efi"
  changed_when: true

- name: "Configure kernel command line"
  # kernel-install reads this to populate the `options` line of every entry it
  # generates (both this initial one and all future automatic ones) - without it,
  # generated entries would have no root= argument at all.
  ansible.builtin.copy:
    dest: "{{ mnt_root_path }}/etc/kernel/cmdline"
    mode: "0644"
    content: >
      root=PARTLABEL={{ partition_root.name }} rw console=tty1 {{
      bootstrap_mac_boot_args if bootstrap_mac else '' }}

- name: "Create initial boot entry for the already-installed kernel"
  # kernel-install's pacman hook (shipped by mkinitcpio) only fires automatically on
  # FUTURE kernel updates - the kernel pacstrap already installed predates
  # `bootctl install`/loader.conf existing, so nothing auto-triggered for it yet.
  # add-all requires the kernel image under /usr/lib/modules/<version>/vmlinuz; if
  # that's not satisfied, fall back to the explicit
  # `kernel-install add <version> /boot/vmlinuz-linux` form instead.
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} kernel-install add-all"
  changed_when: true

- name: "Ensure ansible dependencies are installed in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} pacman -S --noconfirm python3"
  changed_when: true
