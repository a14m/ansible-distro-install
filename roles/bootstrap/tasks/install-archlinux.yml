---
- name: "Update live environment"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "pacman -Sy --needed archlinux-keyring --noconfirm"
  changed_when: true

- name: "Run pacstrap"
  ansible.builtin.command:
    cmd: "pacstrap -K {{ mnt_root_path }} base linux linux-firmware less nano"
  changed_when: true

- name: "Generate fstab"
  ansible.builtin.shell:
    cmd: "genfstab -t PARTLABEL {{ mnt_root_path }} > {{ mnt_root_path }}/etc/fstab"
  changed_when: true

- name: "Configure pacman in chroot"
  ansible.builtin.copy:
    src: "/etc/pacman.conf"
    dest: "{{ mnt_root_path }}/etc/pacman.conf"
    remote_src: true
    force: false
    mode: "0644"

- name: "Configure system in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} {{ item }}"
  changed_when: true
  loop:
    - "pacman-key --init"
    - "pacman-key --populate"
    - "pacman -Syyu --noconfirm"

- name: "Fetch Limine binary release"
  # No distro package used for either OS - fetching the same prebuilt binary
  # release directly keeps Arch and Ubuntu on the exact same Limine version
  ansible.builtin.get_url:
    url: "https://github.com/limine-bootloader/limine/releases/download/\
      v{{ bootstrap_limine_version }}/limine-binary.tar.gz"
    dest: "/tmp/limine-binary.tar.gz"
    checksum: "{{ bootstrap_limine_checksum }}"
    mode: "0644"

- name: "Extract Limine binary release"
  # Archive contains a single flat "limine-binary/" directory (verified against
  # the actual v12.5.2 asset) - no need to search for the binary afterward
  ansible.builtin.unarchive:
    src: "/tmp/limine-binary.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: "Ensure EFI/BOOT directory exists"
  ansible.builtin.file:
    path: "{{ mnt_boot_path }}/EFI/BOOT"
    state: directory
    mode: "0755"

- name: "Install Limine to EFI partition"
  # Plain file copy to the EFI/BOOT fallback path - no NVRAM registration needed
  # for UEFI (limine bios-install/enroll-config are for BIOS and Secure Boot only)
  ansible.builtin.copy:
    src: "/tmp/limine-binary/BOOTX64.EFI"
    dest: "{{ mnt_boot_path }}/EFI/BOOT/BOOTX64.EFI"
    remote_src: true
    mode: "0644"

- name: "Configure Limine base settings"
  ansible.builtin.template:
    src: "limine.conf.j2"
    dest: "{{ mnt_boot_path }}/limine.conf"
    force: false
    mode: "0644"
  # NOTE: this is skipped because the docker test doesn't have proper EFI/BOOT directory created
  tags: ["molecule-notest"]

- name: "Configure Arch Linux boot entry"
  # Limine reads the kernel/initramfs directly off the ext4 root partition via its
  # own fslabel() resource specifier (set at mkfs time via partition_root.fstype_opts)
  # - no copy-to-ESP step, no kernel-update sync hook
  ansible.builtin.blockinfile:
    path: "{{ mnt_boot_path }}/limine.conf"
    marker: "# {mark} ANSIBLE ARCH LINUX ENTRY"
    block: |
      /Arch Linux
      protocol: linux
      kernel_path: fslabel({{ partition_root.name }}):/boot/vmlinuz-linux
      module_path: fslabel({{ partition_root.name }}):/boot/initramfs-linux.img
      cmdline: root=PARTLABEL={{ partition_root.name }} rw console=tty1 {{
        bootstrap_mac_boot_args if bootstrap_mac else '' }}

      /Arch Linux (terminal)
      protocol: linux
      kernel_path: fslabel({{ partition_root.name }}):/boot/vmlinuz-linux
      module_path: fslabel({{ partition_root.name }}):/boot/initramfs-linux.img
      cmdline: root=PARTLABEL={{ partition_root.name }} rw console=tty1 systemd.unit=multi-user.target {{
        bootstrap_mac_boot_args if bootstrap_mac else '' }}
  # NOTE: this is skipped because the docker test doesn't have proper EFI/BOOT directory created
  tags: ["molecule-notest"]

- name: "Ensure ansible dependencies are installed in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} pacman -S --noconfirm python3"
  changed_when: true
