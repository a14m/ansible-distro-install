---
- name: "Update live environment"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "pacman -Sy --needed archlinux-keyring --noconfirm"
  changed_when: true

- name: "Run pacstrap"
  ansible.builtin.command:
    cmd: "pacstrap -K {{ mnt_root_path }} base linux linux-firmware less nano"
  changed_when: true

- name: "Generate fstab"
  ansible.builtin.shell:
    cmd: "genfstab -t PARTLABEL {{ mnt_root_path }} > {{ mnt_root_path }}/etc/fstab"
  changed_when: true

- name: "Configure pacman in chroot"
  ansible.builtin.copy:
    src: "/etc/pacman.conf"
    dest: "{{ mnt_root_path }}/etc/pacman.conf"
    remote_src: true
    force: false
    mode: "0644"

- name: "Configure system in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} {{ item }}"
  changed_when: true
  loop:
    - "pacman-key --init"
    - "pacman-key --populate"
    - "pacman -Syyu --noconfirm"

- name: "Install systemd-boot to EFI partition"
  # ships with base, no separate package needed. Auto-detects the ESP from fstab.
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} bootctl install --esp-path=/boot/efi"
  changed_when: true

- name: "Configure systemd-boot menu timeout"
  # loader.conf lives on the shared ESP, so this also applies to any other
  # distro dual-booted from the same disk
  ansible.builtin.template:
    src: "loader.conf.j2"
    dest: "{{ mnt_boot_path }}/loader/loader.conf"
    mode: "0644"

- name: "Configure kernel command line"
  # kernel-install reads this to populate the `options` line of every entry it
  # generates (both this initial one and all future automatic ones) - without it,
  # generated entries would have no root= argument at all.
  ansible.builtin.copy:
    dest: "{{ mnt_root_path }}/etc/kernel/cmdline"
    mode: "0644"
    content: >
      root=PARTLABEL={{ partition_root.name }} rw console=tty1 {{ bootstrap_boot_args }}

- name: "Set deterministic machine-id"
  ansible.builtin.set_fact:
    bootstrap_machine_id: "{{ ansible_facts.distribution | hash('md5') }}"

- name: "Pin machine-id in chroot"
  # pacstrap seeds its own /etc/machine-id, so kernel-install would otherwise
  # generate a new random one per reinstall - producing a brand new (never
  # cleaned up) boot entry filename every time, since the ESP itself isn't
  # wiped between reinstalls (see partition_wipe). Pinning it lets the
  # cleanup task below target this distro's old entries.
  ansible.builtin.copy:
    dest: "{{ mnt_root_path }}/etc/machine-id"
    mode: "0444"
    content: "{{ bootstrap_machine_id }}"

- name: "Remove stale boot entries from previous installs"
  ansible.builtin.command:
    cmd: >
      find {{ mnt_boot_path }}/loader/entries -maxdepth 1
      -name "{{ bootstrap_machine_id }}-*.conf" -delete
  changed_when: true

- name: "Create initial boot entry for the already-installed kernel"
  # The kernel pacstrap installed predates `bootctl install`, so nothing created its entry yet.
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} kernel-install add-all"
  changed_when: true

- name: "Ensure custom pacman hooks directory exists"
  ansible.builtin.file:
    path: "{{ mnt_root_path }}/etc/pacman.d/hooks"
    state: "directory"
    mode: "0755"

- name: "Install kernel-install sync/prune script"
  # kernel-install add-all never removes entries for kernels pacman already deleted from /usr/lib/modules/,
  # so the 1GiB ESP fills up and the next add fails; prune this machine-id's stale entries before adding.
  ansible.builtin.copy:
    src: "kernel-install-sync"
    dest: "{{ mnt_root_path }}/usr/local/bin/kernel-install-sync"
    mode: "0755"

- name: "Install pacman hook to keep boot entries in sync with kernel/initramfs input changes"
  # Arch ships no kernel-install pacman hook, so without this kernel upgrades never reach the ESP.
  # Triggers copied from mkinitcpio 42's 90-mkinitcpio-install.hook, so nvidia/firmware/modprobe.d
  # upgrades rebuild the ESP initrd too.
  ansible.builtin.copy:
    src: "91-kernel-install.hook"
    dest: "{{ mnt_root_path }}/etc/pacman.d/hooks/91-kernel-install.hook"
    mode: "0644"

- name: "Mask mkinitcpio pacman hooks"
  # They only build/remove /boot/*-linux images that systemd-boot never reads; kernel-install builds the ESP initrd.
  ansible.builtin.file:
    src: "/dev/null"
    dest: "{{ mnt_root_path }}/etc/pacman.d/hooks/{{ item }}"
    state: "link"
    force: true
  loop:
    - "60-mkinitcpio-remove.hook"
    - "90-mkinitcpio-install.hook"

- name: "Ensure ansible dependencies are installed in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} pacman -S --noconfirm python3"
  changed_when: true
