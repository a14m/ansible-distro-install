---
- name: "Include distribution vars"
  ansible.builtin.include_vars: "{{ ansible_facts.distribution | lower }}.yml"

- name: "Ensure install dependencies are installed on live environment"
  ansible.builtin.apt:
    state: "present"
    update_cache: true
    pkg:
      - "debootstrap"
      - "arch-install-scripts"
      - "bash"

- name: "Run debootstrap"
  ansible.builtin.command:
    cmd: "debootstrap
      {{ bootstrap_opts }}
      {{ bootstrap_distro.name }}
      {{ mnt_root_path }}
      {{ bootstrap_distro.mirror_url }}"
  changed_when: true

- name: "Generate fstab"
  ansible.builtin.shell:
    cmd: "genfstab -t PARTLABEL {{ mnt_root_path }} > {{ mnt_root_path }}/etc/fstab"
  changed_when: true

- name: "Configure apt in chroot"
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: "{{ mnt_root_path }}/etc/apt/preferences.d/ignored-package"
      content: "{{ bootstrap_apt_ignored_preferences }}"
    - dest: "{{ mnt_root_path }}/etc/apt/sources.list"
      content: "{{ bootstrap_apt_sources }}"

- name: "Ensure DNS works in chroot"
  # debootstrap seeds /etc/resolv.conf as a symlink to the systemd-resolved stub (127.0.0.53),
  # which is broken when /run is a tmpfs (e.g. in Docker/molecule)
  ansible.builtin.copy:
    src: "/etc/resolv.conf"
    dest: "{{ mnt_root_path }}/etc/resolv.conf"
    follow: false
    force: true
    mode: "0644"

- name: "Configure system in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} {{ item }}"
  changed_when: true
  loop:
    - "apt-get update"
    - "apt-get install -y {{ bootstrap_distro.packages | join(' ') }}"

- name: "Replace sudo-rs with sudo in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} apt-get install -y --allow-remove-essential sudo sudo-rs-"
  changed_when: true

- name: "Fetch Limine binary release"
  # No distro package used for either OS - fetching the same prebuilt binary
  # release directly keeps Arch and Ubuntu on the exact same Limine version
  ansible.builtin.get_url:
    url: "https://github.com/limine-bootloader/limine/releases/download/\
      v{{ bootstrap_limine_version }}/limine-binary.tar.gz"
    dest: "/tmp/limine-binary.tar.gz"
    checksum: "{{ bootstrap_limine_checksum }}"
    mode: "0644"

- name: "Extract Limine binary release"
  # Archive contains a single flat "limine-binary/" directory (verified against
  # the actual v12.5.2 asset) - no need to search for the binary afterward
  ansible.builtin.unarchive:
    src: "/tmp/limine-binary.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: "Ensure EFI/BOOT directory exists"
  ansible.builtin.file:
    path: "{{ mnt_boot_path }}/EFI/BOOT"
    state: directory
    mode: "0755"

- name: "Install Limine to EFI partition"
  # Plain file copy to the EFI/BOOT fallback path - no NVRAM registration needed
  # for UEFI (limine bios-install/enroll-config are for BIOS and Secure Boot only)
  ansible.builtin.copy:
    src: "/tmp/limine-binary/BOOTX64.EFI"
    dest: "{{ mnt_boot_path }}/EFI/BOOT/BOOTX64.EFI"
    remote_src: true
    mode: "0644"

- name: "Configure Limine base settings"
  ansible.builtin.template:
    src: "limine.conf.j2"
    dest: "{{ mnt_boot_path }}/limine.conf"
    force: false
    mode: "0644"
  # NOTE: this is skipped because the docker test doesn't have proper EFI/BOOT directory created
  tags: ["molecule-notest"]

- name: "Configure Ubuntu boot entry"
  # Limine reads the kernel/initramfs directly off the ext4 root partition via its
  # own fslabel() resource specifier (set at mkfs time via partition_root.fstype_opts)
  # - no copy-to-ESP step, no kernel-update sync hook
  ansible.builtin.blockinfile:
    path: "{{ mnt_boot_path }}/limine.conf"
    marker: "# {mark} ANSIBLE UBUNTU ENTRY"
    block: |
      /Ubuntu
      protocol: linux
      kernel_path: fslabel({{ partition_root.name }}):/boot/vmlinuz
      module_path: fslabel({{ partition_root.name }}):/boot/initrd.img
      cmdline: root=PARTLABEL={{ partition_root.name }} rw console=tty1 {{
        bootstrap_mac_boot_args if bootstrap_mac else '' }}

      /Ubuntu (terminal)
      protocol: linux
      kernel_path: fslabel({{ partition_root.name }}):/boot/vmlinuz
      module_path: fslabel({{ partition_root.name }}):/boot/initrd.img
      cmdline: root=PARTLABEL={{ partition_root.name }} rw console=tty1 systemd.unit=multi-user.target {{
        bootstrap_mac_boot_args if bootstrap_mac else '' }}
  # NOTE: this is skipped because the docker test doesn't have proper EFI/BOOT directory created
  tags: ["molecule-notest"]
