---
- name: "Include distribution vars"
  ansible.builtin.include_vars: "{{ ansible_facts.distribution | lower }}.yml"

- name: "Ensure install dependencies are installed on live environment"
  ansible.builtin.apt:
    state: "present"
    update_cache: true
    pkg:
      - "debootstrap"
      - "arch-install-scripts"
      - "bash"

- name: "Run debootstrap"
  ansible.builtin.command:
    cmd: "debootstrap
      {{ bootstrap_opts }}
      {{ bootstrap_distro.name }}
      {{ mnt_root_path }}
      {{ bootstrap_distro.mirror_url }}"
  changed_when: true

- name: "Generate fstab"
  ansible.builtin.shell:
    cmd: "genfstab -t PARTLABEL {{ mnt_root_path }} > {{ mnt_root_path }}/etc/fstab"
  changed_when: true

- name: "Configure apt in chroot"
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: "{{ mnt_root_path }}/etc/apt/preferences.d/ignored-package"
      content: "{{ bootstrap_apt_ignored_preferences }}"
    - dest: "{{ mnt_root_path }}/etc/apt/sources.list"
      content: "{{ bootstrap_apt_sources }}"

- name: "Ensure DNS works in chroot"
  # debootstrap seeds /etc/resolv.conf as a symlink to the systemd-resolved stub (127.0.0.53),
  # which is broken when /run is a tmpfs (e.g. in Docker/molecule)
  ansible.builtin.copy:
    src: "/etc/resolv.conf"
    dest: "{{ mnt_root_path }}/etc/resolv.conf"
    follow: false
    force: true
    mode: "0644"

- name: "Configure system in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} {{ item }}"
  changed_when: true
  loop:
    - "apt-get update"
    - "apt-get install -y {{ bootstrap_distro.packages | join(' ') }}"

- name: "Replace sudo-rs with sudo in chroot"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} apt-get install -y --allow-remove-essential sudo sudo-rs-"
  changed_when: true

- name: "Ensure systemd-boot package installed"
  # pulls in systemd-boot-efi automatically (the actual EFI binaries bootctl deploys)
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} apt-get install -y systemd-boot"
  changed_when: true

- name: "Install systemd-boot to EFI partition"
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} bootctl install --esp-path=/boot/efi"
  changed_when: true

- name: "Configure systemd-boot menu timeout"
  # loader.conf lives on the shared ESP, so this also applies to any other
  # distro dual-booted from the same disk
  ansible.builtin.template:
    src: "loader.conf.j2"
    dest: "{{ mnt_boot_path }}/loader/loader.conf"
    mode: "0644"

- name: "Configure kernel command line"
  # kernel-install reads this to populate the `options` line of every entry it
  # generates (both this initial one and all future automatic ones) - without it,
  # generated entries would have no root= argument at all.
  ansible.builtin.copy:
    dest: "{{ mnt_root_path }}/etc/kernel/cmdline"
    mode: "0644"
    content: >
      root=PARTLABEL={{ partition_root.name }} rw console=tty1 {{
      bootstrap_mac_boot_args if bootstrap_mac else '' }}

- name: "Set deterministic machine-id"
  ansible.builtin.set_fact:
    bootstrap_machine_id: "{{ ansible_facts.distribution | hash('md5') }}"

- name: "Pin machine-id in chroot"
  # debootstrap always starts with a fresh /etc/machine-id, so kernel-install
  # would otherwise generate a new random one per reinstall - producing a
  # brand new (never cleaned up) boot entry filename every time, since the
  # ESP itself isn't wiped between reinstalls (see partition_wipe). Pinning
  # it lets the cleanup task below target this distro's old entries.
  ansible.builtin.copy:
    dest: "{{ mnt_root_path }}/etc/machine-id"
    mode: "0444"
    content: "{{ bootstrap_machine_id }}"

- name: "Remove stale boot entries from previous installs"
  ansible.builtin.command:
    cmd: >
      find {{ mnt_boot_path }}/loader/entries -maxdepth 1
      -name "{{ bootstrap_machine_id }}-*.conf" -delete
  changed_when: true

- name: "Find installed kernel versions"
  # add-all requires the kernel image at /usr/lib/modules/<version>/vmlinuz - not
  # satisfied on Ubuntu (confirmed: linux-image only places it at the traditional
  # /boot/vmlinuz-<version> path), so build the explicit `add` form ourselves instead
  ansible.builtin.command:
    cmd: "arch-chroot {{ mnt_root_path }} ls /usr/lib/modules"
  register: bootstrap_kernel_versions
  changed_when: false

- name: "Create initial boot entry for the already-installed kernel"
  # kernel-install's hook only fires automatically on FUTURE kernel updates - the
  # kernel debootstrap already installed predates `bootctl install`/loader.conf
  # existing, so nothing auto-triggered for it yet.
  # Also unverified: whether apt's kernel postinst auto-invokes kernel-install for
  # future updates the way mkinitcpio's pacman hook does on Arch - confirm on the
  # actual install target before relying on it being fully hands-off long-term.
  ansible.builtin.command:
    cmd: >
      arch-chroot {{ mnt_root_path }} kernel-install add {{ item }}
      /boot/vmlinuz-{{ item }}
  loop: "{{ bootstrap_kernel_versions.stdout_lines }}"
  changed_when: true
