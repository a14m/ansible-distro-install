---
argument_specs:
  main:
    options:
      hostname:
        type: "str"
        required: true
        description: "The distro linux hostname to be configured (will configure if availabe in inventory)"
      partition_boot:
        type: "dict"
        required: true
        description: "Check partition_root argument in role: partition, required options: mount_path"
      partition_root:
        type: "dict"
        required: true
        description: "Check partition_root argument in role: partition, required options: mount_path"
      bootstrap_mac:
        type: "bool"
        required: false
        default: false
        # NOTE: rEFInd also spoofed the reported macOS version here (spoof_osx_version)
        # for older Mac EFI firmware compatibility. Dropped along with rEFInd - no
        # confirmed systemd-boot equivalent, verify before relying on this description.
        description: "Install broadcom-wl driver (required for Intel 2012 Macs)"
      bootstrap_boot_args:
        type: "str"
        required: true
        description: >-
          Extra kernel boot arguments appended to /etc/kernel/cmdline
          (e.g. mac-specific args, pcie_aspm=off for boards with ASPM wake bugs),
          set per host in host_vars, no default
      bootstrap_pi:
        type: "bool"
        required: false
        default: false
        description: "Install Raspberry PI OS (Raspberry ISO reports as Debian)"
      bootstrap_proxmox:
        type: "bool"
        required: false
        default: false
        description: "Install Proxmox VE (Using Debian Live ISO since Proxmox ISO lacks automation)"
      bootstrap_boot_timeout:
        type: "int"
        required: false
        default: 5
        description: "systemd-boot menu timeout in seconds, written to loader.conf on the shared ESP"
      bootstrap_blacklist_modules:
        type: "list"
        elements: "str"
        required: false
        default: []
        description: >-
          Kernel modules to blacklist via /etc/modprobe.d on the installed system
          (e.g. a failing wifi card's driver)
      bootstrap_disable_usb_devices:
        type: "list"
        elements: "str"
        required: false
        default: []
        description: >-
          USB devices to disable via udev on the installed system, as \"idVendor:idProduct\" strings,
          matching lsusb's ID column (e.g. a failing combo card's Bluetooth interface)
