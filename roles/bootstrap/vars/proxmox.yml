---
bootstrap_distro:
  name: "trixie" # => Proxmox VE 9.x (Debian 13)
  mirror_url: "http://deb.debian.org/debian"
  packages:
    - "proxmox-default-kernel"
    - "proxmox-grub"

bootstrap_opts: ""

bootstrap_proxmox_keyring_url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg"
bootstrap_proxmox_keyring_path: "/usr/share/keyrings/proxmox-archive-keyring.gpg"

# NOTE: Debian 13 / PVE 9 use deb822 .sources files instead of sources.list
bootstrap_apt_sources: |
  Types: deb
  URIs: http://deb.debian.org/debian
  Suites: trixie trixie-updates
  Components: main contrib non-free-firmware
  Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

  Types: deb
  URIs: http://security.debian.org/debian-security
  Suites: trixie-security
  Components: main contrib non-free-firmware
  Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

bootstrap_proxmox_apt_sources: |
  Types: deb
  URIs: http://download.proxmox.com/debian/pve
  Suites: trixie
  Components: pve-no-subscription
  Signed-By: {{ bootstrap_proxmox_keyring_path }}
